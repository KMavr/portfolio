name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency override debt
        run: npx debtctl check --strict
      - name: Unmaintained dependencies (advisory)
        if: always()
        run: npx unmaintained --soft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
